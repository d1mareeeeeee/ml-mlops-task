name: interview-ml
services:
  agent:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8091}:8090"
    environment:
      PORT: 8090
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_NAME: ${MODEL_NAME:-}
    volumes:
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 20
